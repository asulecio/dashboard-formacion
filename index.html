<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Satisfacción de la Capacitación | Blue Medical</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📋</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#F4F7FC; --surface:#FFFFFF; --ink:#12284A; --muted:#5E6F87; --line:#E2E9F3;
  --blue:#2F6FDE; --blue-2:#4C8EF0; --blue-soft:#E8F0FD;
  --purple:#8B6FE0; --purple-soft:#F1ECFD;
  --teal:#3BA8D8; --teal-soft:#E6F5FB;
  --green:#2E9B5F; --green-soft:#EAF7EF;
  --rose:#D9486B; --rose-soft:#FDEEF2;
  --d5:#2F6FDE; --d4:#7DB6F4; --d3:#C4A8F0; --d2:#E0567A; --d1:#B7C2D2;
  --track:#E8EDF5;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0B1524; --surface:#122138; --ink:#E7EEF8; --muted:#97A8BF; --line:#22354F;
    --blue:#5A95F2; --blue-2:#79AAF5; --blue-soft:#18304F;
    --purple:#A48CF0; --purple-soft:#2A2448; --teal:#5CC0EA; --teal-soft:#153549;
    --green:#5CC98C; --green-soft:#16342A; --rose:#F07A95; --rose-soft:#3D1F2A;
    --d5:#5A95F2; --track:#1D2E47;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1524; --surface:#122138; --ink:#E7EEF8; --muted:#97A8BF; --line:#22354F;
  --blue:#5A95F2; --blue-2:#79AAF5; --blue-soft:#18304F;
  --purple:#A48CF0; --purple-soft:#2A2448; --teal:#5CC0EA; --teal-soft:#153549;
  --green:#5CC98C; --green-soft:#16342A; --rose:#F07A95; --rose-soft:#3D1F2A;
  --d5:#5A95F2; --track:#1D2E47;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{min-height:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Figtree,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.45}
.wrap{max-width:1180px;margin:0 auto;padding:24px 20px 48px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px}
.ico{flex:none;width:40px;height:40px;border-radius:10px;display:grid;place-items:center;color:#fff}
.ico svg{width:22px;height:22px}
.ico.sm{width:30px;height:30px;border-radius:8px}.ico.sm svg{width:17px;height:17px}

/* header */
header.top{margin-bottom:20px}
.badge{display:inline-block;background:var(--blue-soft);color:var(--blue);font-weight:700;font-size:12px;border-radius:6px;padding:3px 9px}
h1{font-size:clamp(26px,3.6vw,34px);font-weight:800;margin:8px 0 2px;line-height:1.1}
.sub{color:var(--muted);font-size:15px}
.meta{color:var(--muted);font-size:13px;margin-top:6px}
.right{display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:18px;color:var(--ink)}
.logo svg{width:26px;height:26px}
.btn{font:inherit;font-weight:600;font-size:14px;border:1px solid var(--line);color:var(--ink);background:var(--surface);border-radius:10px;padding:9px 14px;cursor:pointer;display:flex;gap:8px;align-items:center}
.btn svg{width:16px;height:16px;color:var(--blue)}
.btn:hover{border-color:var(--blue)}
.btn:focus-visible,.link:focus-visible,.edit:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.link{background:none;border:0;font:inherit;font-size:13px;color:var(--muted);text-decoration:underline;cursor:pointer;padding:0}
.status{font-size:13px;color:var(--muted);text-align:right;max-width:300px}
.status.err{color:var(--rose)}

/* kpis */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:14px}
.kpi{border-radius:14px;padding:18px;display:flex;gap:14px;align-items:flex-start}
.kpi .lb{font-weight:700;font-size:14px}
.kpi .num{font-size:40px;font-weight:800;line-height:1.05;margin:4px 0 2px;font-variant-numeric:tabular-nums}
.kpi .num small{font-size:22px;font-weight:700}
.kpi .pct{display:inline-block;margin-top:8px;background:var(--surface);border-radius:999px;padding:3px 10px;font-size:13px;color:var(--muted)}
.kpi .pct b{color:var(--ink);font-size:15px;font-weight:800}
.kpi .ds{font-size:13px;color:var(--muted)}
.k1{background:var(--blue-soft)}.k1 .ico{background:var(--blue)}
.k2{background:var(--blue-soft)}.k2 .ico{background:var(--blue-2)}
.k3{background:var(--purple-soft)}.k3 .ico{background:var(--purple)}
.k4{background:var(--teal-soft)}.k4 .ico{background:var(--teal)}

.strip{display:flex;flex-wrap:wrap;gap:12px 0;align-items:center;padding:14px 20px;margin-bottom:14px}
.strip .st{flex:1 1 200px;display:flex;align-items:center;gap:10px;justify-content:center;border-left:1px solid var(--line)}
.strip .st:first-child{border-left:0}
.strip .st svg{width:20px;height:20px;color:var(--blue)}
.strip b{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
.strip span{font-size:13px;color:var(--muted)}

.grid2{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(0,1fr);gap:14px;margin-bottom:14px}
.ph{display:flex;gap:12px;align-items:flex-start;margin-bottom:16px}
.ph h2{font-size:18px;font-weight:800;margin:0}
.ph p{margin:0;font-size:13px;color:var(--muted)}
.ph .ico{background:var(--blue-soft);color:var(--blue)}

/* bars */
.brow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) 36px;gap:14px;align-items:center;margin:9px 0}
.brow .q{font-size:13.5px}
.btrack{height:14px;background:var(--track);border-radius:4px;overflow:hidden}
.btrack i{display:block;height:100%;background:var(--c,var(--blue));border-radius:4px}
.brow .v{font-weight:800;text-align:right;font-variant-numeric:tabular-nums}
.axis{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) 36px;gap:14px;font-size:12px;color:var(--muted);margin-top:4px}
.axis .t{display:flex;justify-content:space-between}
.low-tag{font-size:11px;font-weight:700;color:var(--rose);background:var(--rose-soft);border-radius:5px;padding:1px 6px;margin-left:6px;white-space:nowrap}

/* donut */
.donut{display:grid;grid-template-columns:minmax(150px,200px) 1fr;gap:18px;align-items:center}
.donut svg{width:100%;height:auto}
.dc{font-weight:800;fill:var(--ink)}
.dl{fill:var(--muted)}
.leg{list-style:none;margin:0;padding:0;font-size:12.5px}
.leg li{display:grid;grid-template-columns:12px 1fr auto;gap:8px;align-items:center;margin:9px 0}
.leg i{width:12px;height:12px;border-radius:50%}
.leg b{font-variant-numeric:tabular-nums}

/* facilitators */
.facs{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
.fac{border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column}
.fac-h{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.fac-h .av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center}
.fac-h .av svg{width:18px;height:18px}
.fac-h h3{margin:0;font-size:16px;font-weight:800}
.fac .brow{grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) 30px;gap:10px;margin:7px 0}
.fac .brow .q{font-size:12.5px}
.fac .btrack{height:12px}
.fac-f{margin-top:auto;display:flex;justify-content:space-between;align-items:center;border-radius:10px;padding:12px 14px;margin-top:12px;font-weight:700}
.fac-f b{font-size:22px;font-weight:800}
.fac.b .av{background:var(--blue-soft);color:var(--blue)}.fac.b .fac-f{background:var(--blue-soft)}
.fac.p .av{background:var(--purple-soft);color:var(--purple)}.fac.p .fac-f{background:var(--purple-soft)}
.edit{background:none;border:0;padding:0;font:inherit;color:inherit;cursor:pointer;border-bottom:1.5px dashed transparent}
.edit:hover{border-bottom-color:var(--muted)}

.solo{margin-bottom:14px}
.layout{display:flex;min-height:100%}
.sidebar{flex:none;width:250px;background:var(--surface);border-right:1px solid var(--line);padding:22px 16px;display:flex;flex-direction:column;gap:22px;position:sticky;top:env(safe-area-inset-top,0px);align-self:flex-start;height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));overflow-y:auto}
.sidebar .logo{padding:6px 8px;border-radius:10px}
.sidebar .logo img{display:block;width:100%;max-width:190px;height:auto}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .sidebar .logo{background:#fff}}
:root[data-theme="dark"] .sidebar .logo{background:#fff}
.menu{display:flex;flex-direction:column;gap:4px}
.tab{font:inherit;font-weight:600;font-size:14px;text-align:left;background:none;border:0;border-radius:10px;color:var(--muted);padding:10px 12px;cursor:pointer;display:flex;align-items:center;gap:10px}
.tab .mi{display:grid;place-items:center;width:20px;height:20px}.tab .mi svg{width:18px;height:18px}
.tab:hover{background:var(--bg);color:var(--ink)}
.tab[aria-current="page"]{background:var(--blue-soft);color:var(--blue);font-weight:700}
.tab:focus-visible{outline:3px solid var(--blue);outline-offset:-3px}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px}
.side-foot .btn{justify-content:center}
.side-foot .status{text-align:left}
.main{flex:1;min-width:0;max-width:1180px;padding:26px 28px 48px}
.leg.big{font-size:14px}.leg.big li{margin:14px 0}.leg.big b{font-size:18px}
.note{font-size:13px;color:var(--muted);margin:16px 0 0}
.sleg{display:flex;gap:14px;font-size:12.5px;color:var(--muted);margin:-4px 0 10px}
.sleg i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.srow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr) 36px;gap:14px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.srow:first-of-type{border-top:0}
.srow .q{font-size:13.5px}.srow .v{font-weight:800;text-align:right}
.stack{display:flex;height:22px;border-radius:6px;overflow:hidden;background:var(--track)}
.stack span{display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#fff}
.stack .s3,.stack .s4{color:#16243a}
@media (max-width:620px){.srow{grid-template-columns:1fr 36px}.srow .stack{grid-column:1/-1;grid-row:2}.srow .v{grid-row:1;grid-column:2}}
.side{display:flex;flex-direction:column;gap:14px}
.box{border-radius:14px;padding:16px}
.box.g{background:var(--green-soft)} .box.r{background:var(--rose-soft)}
.box .ph{margin-bottom:10px}
.box.g .ph .ico{background:var(--green);color:#fff}.box.r .ph .ico{background:var(--rose);color:#fff}
.rank{background:var(--surface);border-radius:10px;padding:6px 12px;margin:0;list-style:none}
.rank li{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:center;padding:7px 0;font-size:13.5px}
.rank .n{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:12px;font-weight:800}
.box.g .n{background:var(--green)}.box.r .n{background:var(--rose)}
.rank b{font-variant-numeric:tabular-nums}

.comments{display:grid;grid-template-columns:minmax(200px,260px) 1fr;gap:16px;align-items:center}
.comments .ph{margin:0}
.clist{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.clist blockquote{margin:0;background:var(--blue-soft);border-radius:10px;padding:12px 14px;font-size:13.5px}
.clist blockquote:nth-child(3n+2){background:var(--purple-soft)}
.clist blockquote span{display:block;font-size:12px;color:var(--muted);margin-top:4px}
.cnone{font-size:13px;color:var(--muted)}
footer{font-size:12.5px;color:var(--muted);text-align:center;margin-top:16px}

@media (max-width:860px){
  .layout{flex-direction:column}
  .sidebar{position:static;width:auto;height:auto;align-self:stretch;border-right:0;border-bottom:1px solid var(--line);padding:14px 16px;gap:12px}
  .menu{flex-direction:row;overflow-x:auto}.tab{white-space:nowrap}
  .side-foot{margin-top:0;flex-direction:row;flex-wrap:wrap;align-items:center}
  .main{padding:20px 16px 40px}
}
@media (max-width:980px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2{grid-template-columns:1fr}}
@media (max-width:620px){
  .kpis{grid-template-columns:1fr}
  .right{align-items:flex-start}.status{text-align:left}
  .brow,.axis{grid-template-columns:1fr 36px}
  .brow .btrack{grid-column:1/-1;grid-row:2}.brow .v{grid-row:1;grid-column:2}
  .axis{display:none}
  .donut{grid-template-columns:1fr}.donut svg{max-width:200px;margin:0 auto}
  .comments{grid-template-columns:1fr}
  .strip .st{border-left:0;justify-content:flex-start}
}

.menu .grp{font-size:12px;font-weight:700;color:var(--muted);padding:12px 12px 4px}
.tab.sub{padding-left:22px;font-size:13.5px}
.tab .lk{margin-left:auto;display:grid;place-items:center;width:16px;height:16px;opacity:.7}.tab .lk svg{width:14px;height:14px}
.tblwrap{overflow-x:auto}
table.cmp{width:100%;border-collapse:collapse;font-size:14px;min-width:520px}
table.cmp th,table.cmp td{padding:11px 12px;border-bottom:1px solid var(--line);text-align:left}
table.cmp thead th{font-size:13px;color:var(--muted);font-weight:700;background:var(--bg)}
table.cmp thead th:first-child{border-radius:10px 0 0 10px}table.cmp thead th:last-child{border-radius:0 10px 10px 0}
table.cmp tbody th{font-weight:500}
table.cmp .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.cmp td.num{font-weight:700}
table.cmp td.best{color:var(--green)}
table.cmp .mini{display:inline-block;width:60px;height:6px;background:var(--track);border-radius:3px;margin-right:10px;vertical-align:middle;overflow:hidden}
table.cmp .mini i{display:block;height:100%;border-radius:3px}
table.cmp td.diff{color:var(--muted);font-weight:600}
table.cmp tfoot th,table.cmp tfoot td{font-weight:800;border-bottom:0;background:var(--blue-soft)}
table.cmp tfoot tr:first-child th{border-radius:10px 0 0 0}table.cmp tfoot tr:first-child td:last-child{border-radius:0 10px 0 0}
table.cmp tfoot tr.pctrow th{border-radius:0 0 0 10px}table.cmp tfoot tr.pctrow td:last-child{border-radius:0 0 10px 0}
.dotc{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}.dotc.b{background:var(--blue)}.dotc.p{background:var(--purple)}
.lock{max-width:420px;margin:30px auto;text-align:center;padding:32px 28px}
.lock .big{width:56px;height:56px;border-radius:16px;background:var(--blue-soft);color:var(--blue);display:grid;place-items:center;margin:0 auto 14px}
.lock .big svg{width:28px;height:28px}
.lock h2{margin:0 0 6px;font-size:20px}.lock p{margin:0 0 18px;color:var(--muted);font-size:14px}
.lock form{display:flex;gap:8px}
.lock input{flex:1;min-width:0;font:inherit;font-size:15px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.lock input:focus-visible{outline:3px solid var(--blue);outline-offset:1px}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}.btn.pri:hover{background:var(--blue-2)}
.lock .err{color:var(--rose);font-size:13px;min-height:18px;margin-top:10px}
.unl{display:flex;justify-content:flex-end;margin:-6px 0 12px}
.side-foot .note{font-size:12px;color:var(--muted)}
</style>
</head>

async function tryOpen(blob,pw){
  try{
    const raw=Uint8Array.from(atob(blob),c=>c.charCodeAt(0));
    const salt=raw.slice(0,16),iv=raw.slice(16,28),ct=raw.slice(28);
    const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
    const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:310000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
    const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv},key,ct);
    return JSON.parse(new TextDecoder().decode(pt));
  }catch(e){return null}
}

    <div class="kpi k1"><div class="ico">${I.star}</div><div><div class="lb">Satisfacción general</div><div class="num">${fmt(PUB.overall)} <small>/ 5</small></div><div class="ds">Promedio global</div></div></div>
    <div class="kpi k2"><div class="ico">${I.book}</div><div><div class="lb">Contenido de la capacitación</div><div class="num">${fmt(c.avg)} <small>/ 5</small></div><div class="ds">Experiencia de aprendizaje</div><div class="pct"><b>${pct(c.avg)}</b> de satisfacción</div></div></div>
    <div class="kpi k3"><div class="ico">${I.chart}</div><div><div class="lb">Preparación percibida</div><div class="num">${prep?fmt(prep.avg):'–'} <small>/ 5</small></div><div class="ds">Para ofrecer productos y servicios</div></div></div>
    <div class="kpi k4"><div class="ico">${I.people}</div><div><div class="lb">Facilitadores</div><div class="num">${fmt(PUB.facAvg)} <small>/ 5</small></div><div class="ds">Promedio facilitadores</div><div class="pct"><b>${pct(PUB.facAvg)}</b> de satisfacción</div></div></div>
  </div>
  <div class="panel strip">
    <div class="st">${I.doc}<b>${PUB.n}</b><span>Respuestas recibidas</span></div>
    <div class="st">${I.pie}<b>${Math.round(PUB.allPos*100)}%</b><span>Calificaciones 4 o 5</span></div>
    <div class="st">${I.cal}<b>${esc(period(dates))}</b><span>Periodo</span></div>
  </div>
  <div class="panel solo"><div class="ph"><div class="ico sm">${I.book}</div><div><h2>Experiencia de la capacitación</h2><p>Promedio por pregunta (escala 1–5)</p></div></div>
    ${bars(c.items,'var(--blue)',low)}
    <div class="axis"><span></span><div class="t"><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span></div><span></span></div></div>
  ${commentsPanel('Comentarios destacados',c.comments.map(x=>({c:x})),false)}`;
}
function vDist(){
  const c=PUB.content,cd=PUB.cdist,tot=cd.reduce((a,b)=>a+b,0);
  return `<div class="grid2">
    <div class="panel"><div class="ph"><div class="ico sm">${I.pie}</div><div><h2>Distribución de respuestas</h2><p>Todas las preguntas de contenido (1–5)</p></div></div>
      <div class="donut">${donut(cd,tot)}<ul class="leg">${[4,3,2,1,0].map(i=>`<li><i style="background:${DCOL[i]}"></i><span>${DLBL[i]}</span><b>${tot?Math.round(cd[i]/tot*100):0}%</b></li>`).join('')}</ul></div></div>
    <div class="panel"><div class="ph"><div class="ico sm">${I.chart}</div><div><h2>Resumen de respuestas</h2><p>Cantidad de calificaciones por valor</p></div></div>
      <ul class="leg big">${[4,3,2,1,0].map(i=>`<li><i style="background:${DCOL[i]}"></i><span>${DLBL[i]}</span><b>${cd[i]}</b></li>`).join('')}</ul>
      <p class="note">Total de calificaciones de contenido: <b>${tot}</b> (${PUB.n} ${PUB.n===1?'persona':'personas'} × ${c.items.length} preguntas).</p></div>
  </div>
  <div class="panel solo"><div class="ph"><div class="ico sm">${I.book}</div><div><h2>Distribución por pregunta</h2><p>Cuántas personas eligieron cada valor</p></div></div>${stacks(c.items)}</div>`;
}
function vFac(f,k){
  return `<div class="kpis" style="grid-template-columns:repeat(auto-fit,minmax(220px,1fr))">
    <div class="kpi ${k%2?'k3':'k1'}"><div class="ico">${I.user}</div><div><div class="lb">Promedio general</div><div class="num">${fmt(f.avg)} <small>/ 5</small></div><div class="ds">Todas las competencias</div><div class="pct"><b>${pct(f.avg)}</b> de satisfacción</div></div></div>
  </div>
  <div class="panel solo"><div class="ph"><div class="ico sm">${I.people}</div><div><h2>Evaluación por competencia</h2><p>Promedio por competencia (escala 1–5)</p></div></div>
    ${bars(f.items,k%2?'var(--purple)':'var(--blue)',null,true)}
    <div class="axis"><span></span><div class="t"><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span></div><span></span></div></div>
  <div class="panel solo"><div class="ph"><div class="ico sm">${I.chart}</div><div><h2>Distribución de respuestas</h2><p>Cuántas personas eligieron cada valor por competencia</p></div></div>${stacks(f.items,true)}</div>
  ${commentsPanel('Comentarios de los participantes',f.comments.map(x=>({c:x})),false)}`;
}
function vComp(){
  const facs=PUB.facs.map(x=>unlocked[x.key]); const labels=facs[0].items.map(i=>i.short);
  const cell=(v,best,k)=>`<td class="num${best?' best':''}"><span class="mini"><i style="width:${(v-1)/4*100}%;background:${k%2?'var(--purple)':'var(--blue)'}"></i></span>${fmt(v)}</td>`;
  const row=(lab,vals)=>{const mx=Math.max(...vals),mn=Math.min(...vals);return `<tr><th scope="row">${esc(lab)}</th>${vals.map((v,k)=>cell(v,mx>mn&&v===mx,k)).join('')}${facs.length===2?`<td class="num diff">${mx>mn?'+'+(mx-mn).toFixed(1)+' '+esc(facs[vals.indexOf(mx)].name.split(' ')[0]):'Igual'}</td>`:''}</tr>`;};
  return `<div class="panel solo"><div class="ph"><div class="ico sm">${I.people}</div><div><h2>Tabla comparativa</h2><p>Promedio por competencia (escala 1–5). En verde, el valor más alto de cada fila.</p></div></div>
    <div class="tblwrap"><table class="cmp">
      <thead><tr><th scope="col">Competencia</th>${facs.map((f,k)=>`<th scope="col" class="num"><span class="dotc ${k%2?'p':'b'}"></span>${esc(f.name)}</th>`).join('')}${facs.length===2?'<th scope="col" class="num">Diferencia</th>':''}</tr></thead>
      <tbody>${labels.map((lab,r)=>row(lab,facs.map(f=>f.items[r]?f.items[r].avg:NaN))).join('')}</tbody>
      <tfoot>${row('Promedio general',facs.map(f=>f.avg))}
        <tr class="pctrow"><th scope="row">% de satisfacción</th>${facs.map(f=>`<td class="num">${pct(f.avg)}</td>`).join('')}${facs.length===2?'<td></td>':''}</tr></tfoot>
    </table></div></div>
  ${commentsPanel('Comentarios sobre facilitadores',facs.flatMap(f=>f.comments.map(c=>({c,s:f.name}))),true)}`;
}
function vLock(key,label){
  return `<div class="panel lock"><div class="big">${I.lock}</div><h2>Hoja protegida</h2><p>${key==='admin'?'Esta vista es solo para administración. Escribe la contraseña de administrador.':'Escribe la contraseña para ver la evaluación de '+esc(label)+'.'}</p>
    <form id="lf" autocomplete="off"><label for="pw" class="sr" style="position:absolute;left:-9999px">Contraseña</label><input id="pw" type="password" placeholder="Contraseña" autocomplete="current-password"><button class="btn pri" type="submit">Desbloquear</button></form>
    <div class="err" id="lerr" role="alert"></div></div>`;
}

const VIEWS=()=>[
  {id:'resumen',label:'Resumen',icon:'star',title:'Satisfacción de la Capacitación',sub:'Experiencia de aprendizaje y preparación del colaborador'},
  {grp:'Facilitadores'},
  ...PUB.facs.map(f=>({id:'fac-'+f.key,key:f.key,label:f.name,icon:'user',sub1:true,title:'Evaluación: '+f.name,sub:'Resultados por competencia de '+f.name})),
  {id:'comp',key:'admin',label:'Tabla comparativa',icon:'chart',sub1:true,title:'Tabla comparativa',sub:'Comparación de facilitadores por competencia'},
  {id:'dist',label:'Distribución de respuestas',icon:'pie',title:'Distribución de respuestas',sub:'Cuántas personas eligieron cada valor en las preguntas de contenido'}
];
const isOpen=v=>!v.key||(v.key==='admin'?isAdmin:!!unlocked[v.key]);
function renderMenu(){
  document.getElementById('menu').innerHTML=VIEWS().map(v=>v.grp?`<div class="grp">${v.grp}</div>`:
    `<button class="tab${v.sub1?' sub':''}" data-t="${v.id}" aria-current="${v.id===cur?'page':'false'}"><span class="mi">${I[v.icon]}</span>${esc(v.label)}${v.key?`<span class="lk" aria-label="${isOpen(v)?'Desbloqueado':'Bloqueado'}">${isOpen(v)?I.unlock:I.lock}</span>`:''}</button>`).join('');
  document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>show(b.dataset.t)));
  const any=Object.keys(unlocked).length;
  document.getElementById('lockstate').innerHTML=any?`<button class="btn" id="relock">${I.lock} Bloquear hojas</button>`:'';
  const rl=document.getElementById('relock'); if(rl) rl.addEventListener('click',()=>{for(const k in unlocked) delete unlocked[k]; isAdmin=false; show(cur);});
}
function show(id){
  const v=VIEWS().find(x=>x.id===id)||VIEWS()[0]; cur=v.id;
  document.getElementById('vtitle').textContent=v.title; document.getElementById('vsub').textContent=v.sub;
  const d=dates; document.getElementById('meta').textContent=d.length?(dTxt(d[0])===dTxt(d[d.length-1])?'Respuestas del '+dTxt(d[0]):'Respuestas del '+dTxt(d[0])+' al '+dTxt(d[d.length-1])):'';
  const app=document.getElementById('app');
  if(!isOpen(v)){
    app.innerHTML=vLock(v.key,v.label);
    const f=document.getElementById('lf'),inp=document.getElementById('pw'),err=document.getElementById('lerr');
    inp.focus();
    f.addEventListener('submit',async e=>{
      e.preventDefault(); const pw=inp.value; if(!pw) return; err.textContent='Verificando…';
      let ok=false;
      if(v.key!=='admin'){const r=await tryOpen(LOCK[v.key],pw); if(r){Object.assign(unlocked,r); ok=true;}}
      if(!ok){const r=await tryOpen(LOCK.admin,pw); if(r){Object.assign(unlocked,r); isAdmin=true; ok=true;}}
      if(ok) show(v.id); else {err.textContent='Contraseña incorrecta. Intenta de nuevo.'; inp.select();}
    });
  } else if(v.id==='resumen') app.innerHTML=vResumen();
  else if(v.id==='dist') app.innerHTML=vDist();
  else if(v.id==='comp') app.innerHTML=vComp();
  else { const k=PUB.facs.findIndex(f=>f.key===v.key); app.innerHTML=vFac(unlocked[v.key],k); }
  renderMenu(); window.scrollTo(0,0);
}
show('resumen');
</script>
</body>
</html>
